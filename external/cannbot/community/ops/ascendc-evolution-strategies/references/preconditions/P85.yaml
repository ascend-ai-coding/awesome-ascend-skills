checks:
  - id: has_initbuffer
    type: grep_count
    pattern: "InitBuffer|TBuf|workspace|wsLocal|zone"
    files: [kernel]
    expected: ">= 1"
    fail_msg: "未检测到 Buffer/workspace 分配 → 无分区复用空间，不适用 P85。"

  - id: has_stage
    type: grep_count
    pattern: "stage|Stage|阶段|phase|Phase|串行|serial"
    files: [kernel]
    expected: ">= 1"
    fail_msg: "未检测到多阶段串行结构 → 无分时复用场景，不适用 P85。"

  - id: has_offset
    type: grep_count
    pattern: "offset|Offset|alias|Alias|reuse.*zone|zone.*reuse"
    files: [kernel]
    expected: ">= 0"
    fail_msg: "已存在 zone reuse/alias 逻辑 → 可能冗余，优先验证现有策略效果。"
