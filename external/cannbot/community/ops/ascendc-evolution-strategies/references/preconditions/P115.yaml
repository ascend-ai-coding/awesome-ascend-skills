strategy_id: P115
description: FlashAttention Tiling 路由适用性检查 — 算子为 FlashAttention 类，且未按四层架构完成选型与设计节点路由。

strategy_meta:
  id: "P115"
  slug: "P115_flashattention_tiling_routing"
  title: "P115: FlashAttention Tiling 路由"
  bottlenecks: [tiling_mismatch, cube_underutilization, sync_overhead]
  op_families: [attention, flash_attention]
  conflicts_with: []
  synergizes_with: [P14, P18, P38, P55]
  requires: []
  complexity: "L1"
  deprecated: false
  has_preconditions: true
  has_playbook: true
  doc_repo: cannbot-knowledge
  doc_path: "knowledge/contrib/ascendc/optimizations/evolution_strategies/cards/p115_flashattention_tiling_routing.md"
  playbook_path: "knowledge/contrib/ascendc/runbooks/performance/p115_flashattention_tiling_routing.md"
