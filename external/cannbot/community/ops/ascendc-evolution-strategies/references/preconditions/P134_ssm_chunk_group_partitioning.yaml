strategy_id: P134
description: chunk-group 任务划分适用性检查 — 线性递归算子核分配是"全序列一次分核"（跨核状态依赖），未用 chunk-group 分组。

checks:
  - id: has_three_stage_or_chunk
    type: grep_count
    pattern: "chunkSize|CHUNK_SIZE|n_chunks|k_cumdecay|v_inner|Stage1|stage1"
    files: [kernel, header]
    expected: ">= 1"
    fail_msg: "未检测到 chunk/三阶段证据 → 先应用 P132 三阶段分解，再考虑 P134 任务划分。"

  - id: has_full_sequence_partition
    type: grep_count
    pattern: "seqLength|seq_len|totalSeq|GetBlockIdx|coreIdx|blockDim"
    files: [kernel, header, host]
    expected: ">= 1"
    fail_msg: "未检测到序列分核证据 → 需确认当前任务划分方式后再应用 P134。"

  - id: no_chunk_group
    type: grep_count
    pattern: "maxGroupLength|chunkGroup|chunk_group|cg\\b"
    files: [kernel, header, host]
    expected: "== 0"
    fail_msg: "已检测到 chunk-group 证据 → 可能已按 P134 划分，跳过或检查完整性。"
