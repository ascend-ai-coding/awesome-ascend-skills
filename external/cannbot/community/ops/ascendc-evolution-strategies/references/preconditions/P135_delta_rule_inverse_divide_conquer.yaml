strategy_id: P135
description: delta-rule 矩阵求逆分治适用性检查 — 算子含 delta rule（corr/β 修正）的 C×C 矩阵求逆（如 (I+KKT·attn)^{-1}），且当前是整块串行求逆。

checks:
  - id: is_delta_rule
    type: grep_count
    pattern: "beta|corr|修正|delta|kkt|solve_triangular|I-A|inverse"
    files: [kernel, header, model]
    expected: ">= 1"
    fail_msg: "未检测到 delta rule / 求逆证据 → 可能是 GLA（cumprod 衰减无求逆），P135 不适用，跳过。"

  - id: has_triangular_inverse
    type: grep_count
    pattern: "solve_triangular|Inverse|inverse|triangular|tril|前代|substitution"
    files: [kernel, header, model]
    expected: ">= 1"
    fail_msg: "未检测到矩阵求逆证据 → 确认是否为 delta rule 类算子后再应用 P135。"

  - id: no_divide_conquer
    type: grep_count
    pattern: "INVERSE_SHAPE|AttnInverseMMCompute|X10.*X11|off.diag"
    files: [kernel, header]
    expected: "== 0"
    fail_msg: "已检测到分治求逆证据 → 可能已应用 P135，跳过或检查完整性。"
