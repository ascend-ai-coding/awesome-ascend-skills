strategy_id: P113
description: Broadcast 对齐 Tiling 适用性检查 — 算子存在广播语义，输入 shape 不同，且未完整实现 DimensionCollapse 与广播方式选择。

strategy_meta:
  id: "P113"
  slug: "P113_broadcast_aligned_tiling"
  title: "P113: Broadcast 对齐 Tiling 设计"
  bottlenecks: [mte2_stall, ub_pressure, tail_block]
  op_families: [broadcast, elementwise]
  conflicts_with: []
  synergizes_with: [P112, P12, P7, P1]
  requires: []
  complexity: "L1"
  deprecated: false
  has_preconditions: true
  has_playbook: true
  doc_repo: cannbot-knowledge
  doc_path: "knowledge/contrib/ascendc/optimizations/evolution_strategies/cards/p113_broadcast_aligned_tiling.md"
  playbook_path: "knowledge/contrib/ascendc/runbooks/performance/p113_broadcast_aligned_tiling.md"
  playbook_slug: "P113_broadcast_aligned_tiling"
checks:
  - id: has_broadcast_semantics
    type: grep_count
    pattern: "broadcast|Broadcast|BRC|NDDMA"
    files: [kernel, header]
    expected: ">= 1"
    fail_msg: "未检测到广播语义 → P113 不适用。"

  - id: different_shapes
    type: grep_count
    pattern: "inputShape|outputShape|numInputs|num_dims"
    files: [header]
    expected: ">= 2"
    fail_msg: "未检测到多输入 shape 信息 → 无法判断广播。"

  - id: no_dimension_collapse
    type: grep_count
    pattern: 'Collapse|collapsed|flag|stride\\s*=\\s*0'
    files: [kernel, header]
    expected: "== 0"
    fail_msg: "算子已实现 DimensionCollapse / stride 置 0 → P113 主要价值已发挥。"

  - id: has_vector_unit
    type: grep_count
    pattern: "AI_VECTOR_CORE|TaskType::AI_VECTOR|aiv"
    files: [all]
    expected: ">= 1"
    fail_msg: "未检测到 AIV kernel → P113 面向 Vector 广播路径。"
