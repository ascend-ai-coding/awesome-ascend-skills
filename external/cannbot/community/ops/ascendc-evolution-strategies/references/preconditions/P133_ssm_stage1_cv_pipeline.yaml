strategy_id: P133
description: 块内预计算 CV 流水适用性检查 — Stage1 块内预计算存在多级 matmul + 向量预处理交错，且当前用 SyncAll 全局屏障同步（AIC/AIV 互相停等）。

checks:
  - id: has_stage1_precompute
    type: grep_count
    pattern: "kkt|qkt|cumsum|k_cumdecay|v_inner|g_cum|Inverse|inverse|cumprod"
    files: [kernel, header, model]
    expected: ">= 1"
    fail_msg: "未检测到块内预计算证据（kkt/qkt/cumsum/求逆等）→ 可能无 stage1 或已是其他结构，需人工确认。"

  - id: has_syncall_or_no_flag
    type: grep_count
    pattern: "SyncAll|sync_all"
    files: [kernel, header]
    expected: ">= 1"
    fail_msg: "未检测到 SyncAll → 可能已用定向 flag 或单核实现；确认是否仍需 P133（无 SyncAll 但无 flag 时也适用）。"

  - id: has_cube_and_vector_mix
    type: grep_count
    pattern: "__DAV_C220_CUBE__|__DAV_C220_VEC__|Mmad|mmad|AICProcess|GetSubBlockNum"
    files: [kernel, header]
    expected: ">= 1"
    fail_msg: "未检测到 AIC/AIV 分工证据 → 可能纯 cube 或纯 vector；需确认混核程度后再应用 P133。"
