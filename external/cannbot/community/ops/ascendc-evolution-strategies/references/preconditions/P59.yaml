checks:
  - id: has_datacopy
    type: grep_count
    pattern: "DataCopy|CopyOut|Fixpipe"
    files: [kernel]
    expected: ">= 1"
    fail_msg: "未检测到 DataCopy 输出操作 → 无转置融合空间，不适用 P59。"

  - id: has_transpose
    type: grep_count
    pattern: "Transpose|transpose|转置|Permute|permute"
    files: [kernel]
    expected: ">= 1"
    fail_msg: "未检测到 Transpose 操作 → 无需融合转置，不适用 P59。"

  - id: has_stride
    type: grep_count
    pattern: "stride|Stride|srcStride|dstStride"
    files: [kernel]
    expected: ">= 1"
    fail_msg: "未检测到 stride 参数使用 → 无法通过 DataCopy stride 实现转置，不适用 P59。"
