strategy_id: P110
description: Reduction UB 累加器复用适用性检查 — 算子存在分 chunk 归约或 FullLoad 场景，且未合理使用 UB accumulator / tmpBuf。

strategy_meta:
  id: "P110"
  slug: "P110_reduction_ub_accumulator_reuse"
  title: "P110: Reduction UB 累加器复用"
  bottlenecks: [ub_pressure, scalar_compute]
  op_families: [reduction, normalization, softmax]
  conflicts_with: []
  synergizes_with: [P109, P68, A2]
  requires: []
  complexity: "L1"
  deprecated: false
  has_preconditions: true
  has_playbook: true
  doc_repo: cannbot-knowledge
  doc_path: "knowledge/contrib/ascendc/optimizations/evolution_strategies/cards/p110_reduction_ub_accumulator_reuse.md"
  playbook_path: "knowledge/contrib/ascendc/runbooks/performance/p110_reduction_ub_accumulator_reuse.md"
  playbook_slug: "P110_reduction_ub_accumulator_reuse"
checks:
  - id: has_reduce_api
    type: grep_count
    pattern: '\\bReduceSum|ReduceMax|ReduceMin\\s*\\('
    files: [kernel]
    expected: ">= 1"
    fail_msg: "未检测到 Reduce API → P110 不适用。"

  - id: has_split_or_fullload_candidate
    type: grep_count
    pattern: "chunk|ColSplit|RowSplit|FullLoad|rLength|rLengthAlign"
    files: [kernel, header]
    expected: ">= 1"
    fail_msg: "未检测到 Split / FullLoad 相关代码 → 无需 accumulator 复用优化。"

  - id: no_ub_accumulator
    type: grep_count
    pattern: 'accLocal|accumulator|tmpBuf|tmpLocal|TBuf\\s*<\\s*VECCALC\\s*>'
    files: [kernel]
    expected: "== 0"
    fail_msg: "算子已使用 UB accumulator / tmpBuf → P110 主要价值已发挥。"

  - id: is_vector_core
    type: grep_count
    pattern: "AI_VECTOR_CORE|TaskType::AI_VECTOR|aiv"
    files: [all]
    expected: ">= 1"
    fail_msg: "未检测到 AIV kernel 证据 → P110 面向 Vector 单元 reduction。"
