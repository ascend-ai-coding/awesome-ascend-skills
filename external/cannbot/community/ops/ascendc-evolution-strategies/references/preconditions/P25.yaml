strategy_id: P25

strategy_meta:
  id: "P25"
  slug: "P25_datacopy_pad_alignment"
  title: "P25: DataCopyPad 带 Padding 的搬运"
  bottlenecks: [undersize_transfer]
  op_families: [datapath]
  conflicts_with: []
  synergizes_with: []
  requires: []
  complexity: "L1"
  deprecated: false
  has_preconditions: true
  has_playbook: true
  doc_repo: cannbot-knowledge
  doc_path: "knowledge/contrib/ascendc/optimizations/evolution_strategies/cards/p25_datacopy_pad_alignment.md"
  playbook_path: "knowledge/contrib/ascendc/runbooks/performance/p25_datacopy_pad_alignment.md"
