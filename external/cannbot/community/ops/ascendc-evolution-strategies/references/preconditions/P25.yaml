checks:
  - id: has_datacopy
    type: grep_count
    pattern: "DataCopy|DataCopyPad|CopyIn|CopyOut"
    files: [kernel]
    expected: ">= 1"
    fail_msg: "未检测到 DataCopy 操作 → 无 Pad 对齐优化空间，不适用 P25。"

  - id: has_align
    type: grep_count
    pattern: "Align|对齐|pad|Pad|padding"
    files: [kernel]
    expected: ">= 1"
    fail_msg: "未检测到对齐/Pad 相关逻辑 → 无 DataCopyPad 需求，不适用 P25。"

  - id: has_datacopypadextparams
    type: grep_count
    pattern: "DataCopyPadExtParams|padParams|DataCopyPad"
    files: [kernel]
    expected: ">= 0"
    fail_msg: "已存在 DataCopyPad 优化 → 可能冗余，优先验证现有策略效果。"
