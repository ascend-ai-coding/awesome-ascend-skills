# 统计口径与超大 PR 阈值 — 单一来源,scripts/workflow.review_mode.py 读取
# code-fetch 调 review_mode.py 判 oversized；行数统计口径见下方注释段

# ─── 统计口径（行数）— 唯一真源 ────────────────────────────────────
# 「代码行数」「变更行数」如何统计定义在此，file-review 入口与 code-fetch 共用。
# 主 Agent 与子 Agent 一律按本段执行，禁止各自实现——各自实现必然得出不同数字，
# 破坏同一检视内数字的可比性。
#
# 统计对象（两者都排除注释行与空行）：
#   - 文件检视：file_input 内所有代码文件的行数
#   - PR 检视：  diff 中「新增 + 删除」的行数。排除 diff 结构行本身
#                （`+++` / `---` 文件头、`@@` 块头、`\ No newline at end of file`），
#                不含上下文行
#
# 排除规则（按文件扩展名分派，勿一刀切）：
#   C/C++ 族（.c/.cc/.cpp/.cxx/.h/.hh/.hpp/.hxx/.inl/.ipp/.tpp/.asc/.cce；
#             扩展名大小写不敏感）
#     - 行首（去空白后）为 // 或 /* 或 */                  → 排除
#     - 处于未闭合 /* 块注释内的行（含以 * 开头的续行）    → 排除
#     - #include / #define / #if / #ifdef 等预处理指令     → 计入
#       （它们是预处理指令、不是注释。一刀切按 # 排除会系统性漏掉
#         Ascend C 每文件常有的十几到几十行，严重低估规模）
#   脚本/构建族（.py/.sh/.cmake/CMakeLists.txt/Makefile）
#     - 行首（去空白后）为 #                              → 排除
#   通用
#     - 空白行（去空白后为空）                            → 排除
#     - 以 \ 结尾的宏续行                                 → 计入（与首行同属一条指令）
#
# 本口径是启发式，不解析字符串字面量（如 "http://x" 中的 // 不视为注释起始）。
# 判档阈值对几十行偏差不敏感，无需追求精确——但**同一检视内必须只用一套口径**。

# ─── 超大 PR 判定阈值 ────────────────────────────────────────────
# 双高（文件数 > min_files 且 行数 >= min_lines）判定为超大 PR。
# 消费者：scripts/workflow.review_mode.py → JSON {"oversized": bool}。
# 文件检视不传 --files，永不判为超大。命中后仅提示用户建议拆分，不改变编排。
oversized:
  min_files: 20
  min_lines: 3000
