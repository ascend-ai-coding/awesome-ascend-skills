          // 调用两段式接口
          uint64_t workspaceSize;
          aclOpExecutor *executor;
          aclnnAbsGetWorkspaceSize(self, out, &workspaceSize, &executor);

          void *workspace = nullptr;
          aclrtMalloc(&workspace, workspaceSize);

          aclnnAbs(workspace, workspaceSize, executor, stream);

          // 释放资源
