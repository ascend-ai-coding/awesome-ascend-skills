    label: 约束说明
    requirement: |-
      单个参数的约束，就近写在表格里。
      多个参数的组合约束，可以单独写在这个约束章节（复杂约束）。
      对于算子原生语义就存在的约束即竞品也存在的通用约束一律不写，不要重写使用说明里的内容。
      列出该算子在昇腾硬件上实现时的特有限制（即并非其数学定义所固有的限制）。从使用场景、硬件/软件资源、对系统/网络性能或精度影响等角度说明。若无约束填写「无」,不允许空章节。无序列表形式。
      写作清单如下：
      ①确定性计算（必选项）：（固定话术，三选一）
        - aclnnXxx默认确定性实现。
        - aclnnXxx默认非确定性实现，支持通过aclrtSetSysParamOpt开启确定性。
        - aclnnXxx默认非确定性实现，不支持通过aclrtSetSysParamOpt开启确定性。
      ②确定性计算在docs/zh/op_api_list.md要简写（必选项）：（固定话术，配置在表头已说明）
      ③输入shape限制：有超出原生语义的维度限制，需在此说明
      ④输入值域限制：输入数据必须在某值域范围内，在特定范围外存在精度或性能问题的情况，需在此说明
      ⑤输入属性限制：输入属性必须在某值域范围内，在特定范围外拦截报错的情况，需在此说明
      ⑥输入数据类型限制：有某些数据类型在特定模式下性能极差，需在此说明
      ⑦其他限制：按产品区分描述
      ⑧Batch一致性说明（可选，话术3选1）：
        - 默认Batch一致性实现：在xxx条件/xxx场景下满足。
        - 默认非Batch一致性实现，支持通过aclrtSetSysParamOpt开启Batch一致性：在xxx条件/xxx场景下满足。
        - 默认非Batch一致性实现，不支持通过aclrtSetSysParamOpt开启Batch一致性。
      ⑨芯片标签要求：
        - 涉及芯片差异化描述时，必须使用npu注释对包裹，格式为<!-- npu="芯片代号" id编号 -->和<!-- end id编号 -->。
        - id编号说明：本章节从id20开始连续编排（用于唯一标识产品标签块，组装成文档后会统一重编号）。
        - 产品名必须加<term>xxx</term>标记对。
        - npu值与产品映射关系（固定，不可更改）：
          - 950  -> Ascend 950PR&950DT系列产品
          - A3   -> Atlas A3系列产品
          - 910b -> Atlas A2系列产品
          - 310b -> Atlas 200I/500 A2推理产品
          - 310p -> Atlas推理系列产品
          - 910  -> Atlas训练系列产品
        - 当某个差异化描述涉及多个芯片产品时，npu值使用逗号分隔，例如npu="910,310p"表示Atlas训练系列产品和Atlas推理系列产品的共同约束。
    template: |-
      ## 约束说明

      - 确定性说明：aclnnXxx默认确定性实现。

      - Batch一致性说明：在xxx场景下，默认非Batch一致性实现，支持通过aclrtSetSysParamOpt开启Batch一致性。


      <!-- npu="A3,910b,950" id20 -->
      - <term>Atlas A3系列产品</term>、<term>Atlas A2系列产品</term>、<term>Ascend 950PR&950DT系列产品</term>：

        <details>
        <summary>xx场景1说明：</summary>

        - 数据类型：场景1要求xx参数和xx参数数据类型为FLOAT16、BFLOAT16、BOOL。
        - 数据格式：xxx
        - 参数Shape：xxx

        </details>
      <!-- end id20 -->
      <!-- npu="910,310p" id21 -->
      - <term>Atlas训练系列产品</term>、<term>Atlas推理系列产品</term>：不支持场景1，仅支持场景2。
      <!-- end id21 -->
  example:
    label: 示例
    requirement: |-
      1、提供完整的代码示例，包括头文件、接口调用、结果验证
      2、代码必须可编译运行
      3、示例应覆盖典型使用场景
      4、代码注释简洁明了，不解释参数（参数在参数说明章节已解释）
    template: |-
      ## 示例

      ```cpp
      #include "acl/acl.h"

      int main() {
          // 初始化ACL
          aclInit(nullptr);

          // 创建输入tensor
