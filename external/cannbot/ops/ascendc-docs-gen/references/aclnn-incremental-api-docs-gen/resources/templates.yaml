doc_parts:
  support:
    label: 支持的产品
    products:
    - npu: '950'
      id: id1
      product: Ascend 950PR&950DT系列产品
    - npu: A3
      id: id2
      product: Atlas A3系列产品
    - npu: 910b
      id: id3
      product: Atlas A2系列产品
    - npu: 310b
      id: id4
      product: Atlas 200I/500 A2推理产品
    - npu: 310p
      id: id5
      product: Atlas推理系列产品
    - npu: '910'
      id: id6
      product: Atlas训练系列产品
    requirement: |-
      按照模板顺序，使用无序列表列出所有产品，支持写「支持」，不支持写「不支持」。
      正确性：按照实际情况填写。
      一致性：各API中列出的产品型号顺序与规范顺序保持一致。按照模板顺序使用无序列表列出。
      term标记对：产品名需加<term>xxx</term>标记对，且符合html语法规范。
      npu注释对：针对文档中具体产品型号内容需要使用注释对包裹，格式为<!-- npu="芯片代号" id编号 -->和<!-- end id编号 -->。
      注1：全局芯片表如下，顺序不要改变，dev仓包含全部芯片，开源仓仅包含开源芯片。
      注2：若每新增一款产品，需所有aclnn全量适配，给出「支持/不支持」说明。建议开发脚本先批量增加「不支持」说明，再按AR依次放开支持。
    template: |-
      ## 产品支持情况

      <!-- npu="950" id1 -->
      - <term>Ascend 950PR&950DT系列产品</term>：支持
      <!-- end id1 -->
      <!-- npu="A3" id2 -->
      - <term>Atlas A3系列产品</term>：支持
      <!-- end id2 -->
      <!-- npu="910b" id3 -->
      - <term>Atlas A2系列产品</term>：支持
      <!-- end id3 -->
      <!-- npu="310b" id4 -->
      - <term>Atlas 200I/500 A2推理产品</term>：不支持
      <!-- end id4 -->
      <!-- npu="310p" id5 -->
      - <term>Atlas推理系列产品</term>：支持
      <!-- end id5 -->
      <!-- npu="910" id6 -->
      - <term>Atlas训练系列产品</term>：支持
      <!-- end id6 -->
  summary:
    label: 功能说明
    requirement: |-
      1、简要介绍接口功能，增加V版本之间功能对比
      2、罗列计算公式
      3、多个aclnn接口写在一个文档内的情况，需要简要介绍多个aclnn接口间的区别。Inplace和非Inplace的接口区别默认已知不写。
      目标：指导用户快速理解算子使用场景、计算逻辑和作用。
      ①算子接口功能（必选）：讲清楚接口功能、计算逻辑、使用场景、与其他接口关系（若有请提供跳转链接）等，可参考友商表述，但不能使用友商术语。
      ②计算公式（可选）：复杂算子建议有公式，公式变量需给出解释。
      ③示例（可选）：复杂算子，根据实际需要，可通过示例阐述计算逻辑。
      ④公式要求：第一，保证公式位置缩进正确（缩进2个空格），属于「计算公式」段落。第二，对于行内公式，与上下文字之间必需加空行，且$后不能有空字符，否则昇腾社区展示有问题。
      ⑤区分芯片：若功能在不同芯片上有差异，请分别描述，无序列表形式。
    template: |-
      ## 功能说明

      - 接口功能：完成任意两个张量的矩阵乘计算。
      - 版本演进：本接口兼容aclnnXxxxV2功能，在其基础上新增支持xxx功能。
      - 计算公式：

        - 场景1：先计算xx，再计算xxx，输出xxx。

          $$
          out_i = self_i+alpha \times other_i
          $$

        - 场景2：先计算xx，再计算xxx，输出xxx。

          $$
          out_i = self_i+alpha
          $$
  function_proto:
    label: 函数原型
    requirement: |-
      1、固定写法，介绍算子两段式接口调用流程
      2、每个接口一个单独的代码块，每行一个参数，各行参数缩进位置要对齐规整。
      3、标明Cpp语言类型。不添加用于解释参数的注释信息。
    template: |-
      ## 函数原型

      每个算子分为两段式接口，必须先调用"aclnnXxxGetWorkspaceSize"接口获取计算所需workspace大小以及包含了算子计算流程的执行器，再调用"aclnnXxx"接口执行计算。

      ```cpp
      aclnnStatus aclnnXxxGetWorkspaceSize(
        const aclTensor  *self,
        const aclTensor  *other,
        const aclScalar  *alpha,
        char             *beta,
        uint64_t          theta,
        double            x,
        bool              flag,
        aclTensor        *out,
        uint64_t         *workspaceSize,
        aclOpExecutor    **executor)
      ```

      ```cpp
      aclnnStatus aclnnXxx(
        void             *workspace,
        uint64_t          workspaceSize,
        aclOpExecutor    *executor,
        aclrtStream       stream)
      ```
  sub_function_hash:
    aclnnXxxGetWorkspaceSize_param_and_return:
      label: aclnn(inplace)XxxGetWorkspaceSize 参数说明与返回值
      requirement: |-
        **参数说明**
        1、表格固定呈现8个字段，不支持自定义。
            - ①参数名：参数名（参数类型），要求中文括号+\*前后不带空格+宽度自定义，要求参数名不能换行。
            - ②描述：给出参数含义+公式变量映射，不要写约束。
            - ④数据类型：仅aclXxx类型参数（如aclTensor/aclTensorList/aclScalar/aclIntArray等）需要填写；非此类对象，属于C本身自带的参数类型（如char*/bool/uint64/float/double等），不需要填写。
            - ⑤数据格式：ND、FRACTAL_NZ（NZ）等
            - ⑥非连续Tensor：不涉及的打-，涉及的参数若支持非连续打√、不支持的打×。
            - ③使用说明（其他字段无法承载的剩余内容）：
                - 空Tensor支持度（必选，支持和不支持讲清楚）+参数带Optioal后缀需显式讲传空指针场景+其他约束（取值/范围/场景等）
                - 备注：实际软件要求“空Tensor”默认支持，但是资料公共地方没说明过，因此建议所有接口显式讲清楚，避免混淆。
        2、区分芯片写作：
            - 数据类型、shape、format、取值等信息，表里提供所有产品支持的并集，差异描述放在表下方。注意：不要在表格里区分芯片描述，差异化描述在表格外，以npu注释对+无序列表形式组织。
            - 表下方差异化描述必须使用npu注释对包裹，格式为<!-- npu="芯片代号" id编号 -->和<!-- end id编号 -->，npu值可逗号分隔多个芯片。
            - 产品名必须加<term>xxx</term>标记对。
            - id编号说明：本章节从id10开始连续编排（用于唯一标识产品标签块，组装成文档后会统一重编号）。
        3、表格自动生成md语法
        4、表格位置：必须在“参数说明”子标题模块内，要缩进下
        5、符号要求：①中文语境用中文符号；②空格不允许有，例如中英文混合不能有空格。
        6、表格格式要求：
