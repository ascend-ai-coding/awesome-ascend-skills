            - xx、xx或xx的shape维度不在支持的范围内
            - xx、xx的shape维度不匹配
            - xx、xx的shape不满足broadcast规则
            - xx的shape不满足输出shape推导公式
        3、芯片要求：校验表里原因不要区分芯片，最好模糊和笼统，因为本表不支持按芯片过滤
        4、表格位置：表格缩进，与“返回值”文字对齐，表格下方文字缩进
